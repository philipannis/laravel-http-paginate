# Verify the package whenever code is pushed or proposed for review.
name: Tests

on:
  push:
  pull_request:

# Test jobs need repository access without permission to change its contents.
permissions:
  contents: read

jobs:
  test:
    # Resolve each framework independently on its supported PHP versions.
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '10'
          - php: '8.3'
            laravel: '12'
            testbench: '10'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
          - php: '8.4'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
          - php: '8.5'
            laravel: '12'
            testbench: '10'
          - php: '8.5'
            laravel: '13'
            testbench: '11'

    steps:
      # Fetch the proposed package before installing its test tools.
      - name: Check out code
        uses: actions/checkout@v6

      # Install the selected PHP runtime with Composer and no coverage driver.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
        env:
          update: true

      # Reject invalid package metadata before dependency resolution.
      - name: Validate Composer configuration
        run: composer validate --strict

      # Resolve a fresh dependency set for the exact framework major under test.
      - name: Install dependencies for this Laravel version
        run: >
          composer update
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:^${{ matrix.testbench }}.0"
          --prefer-dist --no-interaction --no-progress

      # Guard against an accidental dependency resolution to the other supported major.
      - name: Verify Laravel version
        env:
          EXPECTED_LARAVEL_MAJOR: ${{ matrix.laravel }}
        run: |
          php -r '
            // Load the resolved framework and compare its major with the matrix selection.
            require "vendor/autoload.php";
            $actual = \Illuminate\Foundation\Application::VERSION;
            $expected = getenv("EXPECTED_LARAVEL_MAJOR");

            // Fail this job if Composer selected a different framework major.
            if ((int) $actual !== (int) $expected) {
                fwrite(STDERR, "Expected Laravel $expected, got $actual\n");
                exit(1);
            }

            // Include the exact framework version in the job output.
            echo "Laravel $actual\n";
          '

      # Verify installed dependencies can run on the actual PHP runtime and extensions.
      - name: Check platform requirements
        run: composer check-platform-reqs

      # Run all behavior and integration tests with network requests blocked.
      - name: Run tests
        run: composer run test

      # Enforce the package's Laravel Pint formatting configuration.
      - name: Check formatting
        run: composer run format:check
